
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Forgot Password | All-in-One Quotation</title>

  <link rel="stylesheet" href="auth.css">

  <style>
    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
    }

    .message {
      text-align: center;
      margin-top: 15px;
      line-height: 1.5;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>

</head>

<body>

  <div class="auth-container">

    <div class="logo">
      All-in-One Quotation
    </div>

    <h1>Forgot Password?</h1>

    <p class="subtitle">
      Enter your email address and we will send you
      instructions to reset your password.
    </p>

    <form id="forgotForm">

      <label>Email Address</label>

      <input
        type="email"
        id="email"
        placeholder="Enter your registered email"
        required
      >

      <p
        id="message"
        class="message"
        aria-live="polite">
      </p>

      <button type="submit" id="resetBtn">
        Send Reset Link
      </button>

    </form>

    <a href="signin.html" class="back-link">
      Back to Sign In
    </a>

  </div>

  <script type="module">

    import { auth } from "./firebase.js";

    import {
      sendPasswordResetEmail
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

    const form = document.getElementById("forgotForm");

    const emailInput = document.getElementById("email");

    const message = document.getElementById("message");

    const resetBtn = document.getElementById("resetBtn");

    form.addEventListener("submit", async function(e) {

      e.preventDefault();

      const email = emailInput.value.trim();

      message.textContent = "";

      resetBtn.disabled = true;

      resetBtn.textContent = "Sending...";

      try {

        await sendPasswordResetEmail(auth, email);

        message.className = "message success";

        message.textContent =
          "If an account exists for this email, a password reset link will be sent. Please check your inbox and spam folder.";

        form.reset();

      } catch (error) {

        console.error("Password reset error:", error);

        // Do not reveal whether an email is registered.
        message.className = "message success";

        message.textContent =
          "If an account exists for this email, a password reset link will be sent. Please check your inbox and spam folder.";

      } finally {

        resetBtn.disabled = false;

        resetBtn.textContent = "Send Reset Link";

      }

    });

  </script>

</body>
</html>
