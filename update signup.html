
<div class="divider-text">
  OR
</div>

<button type="button" id="googleSignUpBtn"
        class="google-btn">

  <img
    src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
    alt="Google"
  >

  Sign Up with Google

</button>

<p id="googleMessage" class="message"
   aria-live="polite"></p>

<script type="module">
  import { signInWithGoogle } from "./google-auth.js";

  const button = document.getElementById("googleSignUpBtn");
  const message = document.getElementById("googleMessage");

  button.addEventListener("click", async () => {
    button.disabled = true;
    message.textContent = "Connecting to Google...";

    try {
      await signInWithGoogle();
    } catch (error) {
      message.textContent = error.message;
      button.disabled = false;
    }
  });
</script>
